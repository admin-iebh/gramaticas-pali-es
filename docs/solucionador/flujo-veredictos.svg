<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#5a5148"/>
    </marker>
  </defs>
  <style>
    .caja  { fill:#faf6ef; stroke:#5a5148; stroke-width:1.5; }
    .hito  { fill:#efe7d8; stroke:#8a6d1f; stroke-width:1.8; }
    .malo  { fill:#f6efe4; stroke:#a8a095; stroke-width:1.3; stroke-dasharray:6 5; }
    .tit   { font-size:19px; font-weight:bold; fill:#2e2a25; }
    .txt   { font-size:15px; fill:#443f38; }
    .nota  { font-size:13.5px; font-style:italic; fill:#6b6257; }
    .fle   { stroke:#5a5148; stroke-width:1.7; fill:none; marker-end:url(#p); }
    .etq   { font-size:14px; fill:#5a5148; }
    .num   { font-size:17px; font-weight:bold; fill:#8a6d1f; }
  </style>

  <text x="600" y="34" text-anchor="middle" class="tit" font-size="22">El camino de un veredicto — del navegador del revisor a la página pública</text>

  <!-- vuelta (por arriba, con su propio carril) -->
  <path class="fle" d="M1045 540 V 62 H 250 V 74"/>
  <text x="700" y="56" text-anchor="middle" class="etq">al desplegar, la forma responde «sandhi adjudicado» — el ciclo se cierra</text>

  <!-- 1 · la página -->
  <rect class="caja" x="60" y="80" width="380" height="158" rx="8"/>
  <circle cx="96" cy="108" r="15" fill="#8a6d1f"/><text x="96" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#faf6ef">1</text><text x="120" y="114" class="tit">La página, en modo revisión</text>
  <text x="80" y="136" class="txt">El revisor marca veredictos sobre cada voz,</text>
  <text x="80" y="157" class="txt">registra sandhis no detectados</text>
  <text x="80" y="178" class="txt">(voz escrita = voz + voz) y anota</text>
  <text x="80" y="199" class="txt">observaciones generales.</text>
  <text x="80" y="224" class="nota">?revision · ?revision=estudiante (sin «Enviar»)</text>

  <!-- enviar → cola -->
  <path class="fle" d="M440 140 H 495"/>
  <text x="468" y="128" text-anchor="middle" class="etq">«Enviar»</text>

  <!-- 2 · la cola -->
  <rect class="caja" x="500" y="80" width="360" height="158" rx="8"/>
  <circle cx="536" cy="108" r="15" fill="#8a6d1f"/><text x="536" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#faf6ef">2</text><text x="560" y="114" class="tit">La cola del proyecto</text>
  <text x="520" y="136" class="txt">POST /api/veredictos → Cloudflare KV.</text>
  <text x="520" y="157" class="txt">Enviar es abierto; leer y vaciar piden</text>
  <text x="520" y="178" class="txt">la clave (CLAVE_VEREDICTOS).</text>
  <text x="520" y="224" class="nota">buzón de 90 días, no archivo</text>

  <!-- exportar → md a mano -->
  <path class="fle" d="M250 238 V 318"/>
  <text x="262" y="268" class="etq">«Exportar .md» — repuesto,</text>
  <text x="262" y="286" class="etq">y camino del estudiante</text>

  <rect class="malo" x="60" y="322" width="380" height="110" rx="8"/>
  <text x="80" y="352" class="tit" font-size="16.5">El .md viaja a mano</text>
  <text x="80" y="377" class="txt">El estudiante se lo hace llegar a quien firma,</text>
  <text x="80" y="398" class="txt">que lo revisa antes de incorporarlo.</text>

  <!-- cola → mac -->
  <path class="fle" d="M680 238 V 318"/>
  <text x="692" y="268" class="etq">traer_veredictos.py</text>
  <text x="692" y="286" class="etq">(con la clave)</text>

  <!-- 3 · la mac -->
  <rect class="hito" x="500" y="322" width="400" height="186" rx="8"/>
  <circle cx="536" cy="350" r="15" fill="#8a6d1f"/><text x="536" y="356" text-anchor="middle" font-size="16" font-weight="bold" fill="#faf6ef">3</text><text x="560" y="356" class="tit">La Mac de quien firma</text>
  <text x="520" y="378" class="txt">· guarda el lote en veredictos-recibidos/</text>
  <text x="520" y="399" class="txt">  (el registro permanente)</text>
  <text x="520" y="420" class="txt">· incorporar_adjudicaciones.py: cada</text>
  <text x="520" y="441" class="txt">  veredicto, un caso con fuente y fecha</text>
  <text x="520" y="470" class="nota">las observaciones no se vuelven casos: se leen,</text>
  <text x="520" y="488" class="nota">y quien firma decide si paren reglas</text>

  <path class="fle" d="M440 377 H 495"/>

  <!-- 3 → 4 -->
  <path class="fle" d="M700 508 V 555"/>

  <!-- 4 · la puerta -->
  <rect class="hito" x="500" y="560" width="400" height="150" rx="8"/>
  <circle cx="536" cy="588" r="15" fill="#8a6d1f"/><text x="536" y="594" text-anchor="middle" font-size="16" font-weight="bold" fill="#faf6ef">4</text><text x="560" y="594" class="tit">La puerta que no se salta</text>
  <text x="520" y="616" class="txt">generar_solucionador.py → página nueva;</text>
  <text x="520" y="637" class="txt">los CINCO arneses, todos en verde;</text>
  <text x="520" y="658" class="txt">referencias y medición, si la señal cambió.</text>
  <text x="520" y="686" class="nota">si un arnés falla, nada se publica</text>

  <!-- firma → 5 -->
  <path class="fle" d="M900 632 H 955"/>
  <text x="928" y="620" text-anchor="middle" class="etq">firma</text>

  <!-- 5 · commit y push -->
  <rect class="caja" x="960" y="560" width="180" height="150" rx="8"/>
  <circle cx="996" cy="588" r="15" fill="#8a6d1f"/><text x="996" y="594" text-anchor="middle" font-size="16" font-weight="bold" fill="#faf6ef">5</text><text x="1016" y="594" class="tit" font-size="16">Commit y push</text>
  <text x="980" y="624" class="txt">git push despliega</text>
  <text x="980" y="645" class="txt">en Cloudflare, y la</text>
  <text x="980" y="666" class="txt">página ya responde.</text>

  <!-- la doctrina -->
  <rect class="caja" x="60" y="560" width="380" height="150" rx="8"/>
  <text x="80" y="590" class="tit" font-size="16.5">La doctrina, en una línea</text>
  <text x="80" y="616" class="txt">Nada se adjudica solo: la cola acerca los</text>
  <text x="80" y="637" class="txt">veredictos, pero la puerta es el incorporador,</text>
  <text x="80" y="658" class="txt">los arneses y la firma del IEBH.</text>
</svg>
